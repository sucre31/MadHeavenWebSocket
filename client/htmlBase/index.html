<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAME MONITOR</title>

<style>
body {
    margin: 0;
    font-family: sans-serif;
    background: #111;
    color: #fff;
}

#heatBar {
    height: 20px;
    background: red;
    width: 0%;
}

#players {
    margin-top: 20px;
    font-size: 14px;
}
</style>
</head>

<body>

<h2>GAME MONITOR</h2>

<div id="heatBar"></div>
<div id="ratio"></div>

<div id="players"></div>

<script>
const socket = new WebSocket('wss://madheavenwebsocket.onrender.com');

const heatBar = document.getElementById('heatBar');
const ratioText = document.getElementById('ratio');
const playersDiv = document.getElementById('players');

socket.onopen = () => {
    console.log("connected");
    socket.send(JSON.stringify({ type: 'REGISTER', role: 'game' }));
};

socket.onmessage = (event) => {
    const data = JSON.parse(event.data);

    if (data.type === 'CONFIG') return;

    const ratio = data.heatRatio || 0;
    heatBar.style.width = (ratio * 100) + "%";
    ratioText.innerText = "ratio: " + (ratio * 100).toFixed(1) + "%";

    playersDiv.innerHTML = "";

    data.details.forEach(p => {
        const div = document.createElement('div');
        div.innerText =
            `${p.id} | heat:${p.heat.toFixed(2)} | x:${p.x.toFixed(2)} y:${p.y.toFixed(2)} accel:${p.accel.toFixed(2)}`;
        playersDiv.appendChild(div);
    });

    if (data.type === 'BURST') {
        document.body.style.background = "red";
        setTimeout(() => document.body.style.background = "#111", 300);
    }
};

socket.onclose = () => {
    console.log("disconnected");
};
</script>

</body>
</html>
